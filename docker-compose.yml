# mcp-login: one container.
#
# Every variable the code reads must appear in the `environment:` block below. Stack managers
# that "substitute" variables into compose (Portainer, for one) do not inject anything that is
# not listed here, and the code would quietly fall back to its default.
# tests/test_compose_env.py asserts the two stay in step.

services:
  mcp-login:
    build: .
    container_name: mcp-login
    restart: unless-stopped
    ports:
      # No default on purpose: an unset port stops the deploy instead of colliding with
      # whatever already listens on the host.
      - "${MCP_LOGIN_HOST_PORT:?set MCP_LOGIN_HOST_PORT to a free host port}:8000"
    environment:
      MCP_LOGIN_HOST: "0.0.0.0"
      MCP_LOGIN_PORT: "8000"
      MCP_LOGIN_DATA_DIR: "/var/lib/mcp-login"
      MCP_LOGIN_CLIENTS_FILE: "/app/clients.json"
      # The public URL, exactly as browsers and the MCP servers see it. It is the `iss` of
      # every token; changing it signs everyone out.
      MCP_LOGIN_ISSUER: "${MCP_LOGIN_ISSUER:?set MCP_LOGIN_ISSUER to the public https URL}"

      # Name shown on the sign-in pages.
      MCP_LOGIN_BRAND: "${MCP_LOGIN_BRAND:-MCP Sign-in}"
      # Privacy policy fields. Until all three are set, /privacy answers "not yet published".
      MCP_LOGIN_PRIVACY_ENTITY: "${MCP_LOGIN_PRIVACY_ENTITY:-}"
      MCP_LOGIN_PRIVACY_CONTACT: "${MCP_LOGIN_PRIVACY_CONTACT:-}"
      MCP_LOGIN_PRIVACY_EFFECTIVE: "${MCP_LOGIN_PRIVACY_EFFECTIVE:-}"

      # Upstream providers. A provider with no id/secret is simply not offered.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:-}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET:-}"

      # One secret per MCP server in clients.json: 'client-id:secret,...'.
      # The service refuses to start if a client has none, or a secret is short.
      MCP_LOGIN_CLIENT_SECRETS: "${MCP_LOGIN_CLIENT_SECRETS}"

      # Optional. Your own Entra tenant id and your own email domains: addresses on those
      # domains are then accepted ONLY via Microsoft from that tenant, so staff always pass
      # your own MFA. Leave both empty if you have no staff accounts to protect.
      MCP_LOGIN_STAFF_TENANT: "${MCP_LOGIN_STAFF_TENANT:-}"
      MCP_LOGIN_STAFF_DOMAINS: "${MCP_LOGIN_STAFF_DOMAINS:-}"

      MCP_LOGIN_ACCESS_TTL: "${MCP_LOGIN_ACCESS_TTL:-3600}"
      MCP_LOGIN_REFRESH_TTL_DAYS: "${MCP_LOGIN_REFRESH_TTL_DAYS:-30}"
      # Stated in the privacy policy (/privacy); the sweeper enforces it.
      MCP_LOGIN_AUDIT_RETENTION_DAYS: "${MCP_LOGIN_AUDIT_RETENTION_DAYS:-365}"
    volumes:
      # Signing key, pending sign-ins, refresh-token HASHES, audit log. Losing it signs
      # everyone out once (they reconnect); nothing else.
      - mcp-login-data:/var/lib/mcp-login
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    ulimits:
      nofile: { soft: 4096, hard: 8192 }

volumes:
  mcp-login-data:
